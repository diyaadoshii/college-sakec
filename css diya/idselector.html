<!DOCTYPE html>
<html>
    <head>
        <title> ID selector demo</title>
        <style>
            #para{
                text-align:center;
                color:red;

            }
        </style>
    </head>

        <p id="para">This paragraph is styled by id selector</p>
        <p> This para is not affected by the style</p>
    </body>
</html>
