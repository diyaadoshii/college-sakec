<!DOCTYPE html>
<html>
    <head>
        <title> Rowspan and Colspan</title>
    </head>
    <body>
        <h2>Student Details</h2>
        <table border="1">
            <tr>
                <th colspan="2">Student info</th>

            </tr>
            <tr>
                <th>Name</th>
                <th>Subject</th>
            </tr>
        <tr>
            <td rowspan="3">Rahul</td>
        </tr>
        <tr>
            <td>Physics</td>
        </tr>
        <tr>
            <td>Chemistry</td>
        </tr>
        <tr>
            <td>Maths</td>
        </tr>
        </table>
    </body>
</html>
